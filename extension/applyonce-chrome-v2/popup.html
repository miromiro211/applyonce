<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>ApplyOnce</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 300px;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    margin: 0;
    padding: 18px;
    color: #1c2333;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: #4b4bd6; }
  .sub { font-size: 11.5px; color: #767f95; margin-bottom: 16px; }

  .section { margin-bottom: 14px; }
  .section-title { font-size: 11px; color: #767f95; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }

  .profile-box {
    background: #f7f6f1; border: 1px solid #e7e2d6; border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; min-height: 20px;
  }
  .profile-box .name { font-weight: 600; }
  .profile-box .empty { color: #a39d8a; font-style: italic; }

  button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
  }
  button.primary { background: #4b4bd6; color: #fff; }
  button.ghost { background: #fff; color: #1c2333; border: 1px solid #e2e2e2; }
  button:disabled { background: #d8d5cb; color: #fff; cursor: not-allowed; }

  .status { font-size: 11.5px; color: #767f95; min-height: 16px; text-align: center; }
  .status.error { color: #b23b2e; }
  .status.success { color: #3f7a5c; }

  .hint { font-size: 11px; color: #a39d8a; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="brand"><span class="dot"></span> ApplyOnce</div>
  <div class="sub">저장된 프로필로 폼을 자동으로 채워요</div>

  <div class="section">
    <div class="section-title">동기화된 프로필</div>
    <div class="profile-box" id="profileBox">
      <span class="empty">아직 동기화되지 않았습니다</span>
    </div>
  </div>

  <button class="ghost" id="syncBtn">프로필 동기화</button>
  <button class="primary" id="fillBtn">이 페이지 자동 채우기</button>

  <div class="status" id="status"></div>
  <div class="hint">구글폼 페이지를 열어둔 상태에서 "자동 채우기"를 누르세요. 웹 앱(localhost:3000)에서 프로필을 저장한 뒤 동기화해야 합니다.</div>

  <script src="popup.js"></script>
</body>
</html>
